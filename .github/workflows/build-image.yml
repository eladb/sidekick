name: build-image

# Builds the sidekick container image (Dockerfile bakes provision.sh at build
# time) and publishes it to the GitHub Container Registry. This is the image
# the container platforms (fly.io, the optional Docker path) pull instead of
# installing everything at boot — see README "Architecture".
on:
  push:
    branches: [main, claude/chat-session-unz83h]
    paths:
      - Dockerfile
      - provision.sh
      - configure-and-start.sh
      - Caddyfile.tmpl
      - supervisord.sidekick.conf.tmpl
      - scripts/tunnel-watcher.sh
      - services/execd/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # amd64 only for now — fly machines and typical Docker hosts are amd64.
      # Add linux/arm64 here (via QEMU) if arm targets are needed later.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
