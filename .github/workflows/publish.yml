name: Publish image

# Builds the sidekick container image (the Dockerfile bakes provision.sh at
# build time) and publishes it to the GitHub Container Registry. This is the
# image the container platforms (fly.io, the optional Docker path) pull instead
# of installing everything at boot — see README "Architecture".
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - provision.sh
      - configure-and-start.sh
      - Caddyfile.tmpl
      - supervisord.sidekick.conf.tmpl
      - services/**
      - scripts/tunnel-watcher.sh
      - .github/workflows/publish.yml
  workflow_dispatch: {}

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only — fly machines and typical Docker hosts are amd64. Add
      # linux/arm64 here (via QEMU) if arm targets are needed later.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
